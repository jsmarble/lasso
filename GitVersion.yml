workflow: GitHubFlow/v1
label: null
strategies:
  - Mainline
branches:
  main:
    regex: ^master$|^main$
    label: null
    mode: ContinuousDeployment
    increment: Patch
    is-main-branch: true
  unknown:
    regex: (?<BranchName>.+)
    label: '{BranchName}'
    increment: Patch
    source-branches:
      - main
ignore:
  sha: []
